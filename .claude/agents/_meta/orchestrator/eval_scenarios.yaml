- scenario: User asks to 'create an API endpoint for user profiles'.
  expected_behavior: Agent runs prompt-analyzer, builds an execution plan assigning backend-developer
    as primary and database-engineer as support, and presents it for approval before delegating.
- scenario: User asks to 'optimize database performance'.
  expected_behavior: Agent routes database-engineer as the primary agent (not backend-developer), with
    devops-engineer in support for monitoring.
- scenario: User asks for a trivial one-line README typo fix.
  expected_behavior: Agent still routes it appropriately (e.g. directly or to the smallest relevant specialist)
    without forcing an oversized multi-agent execution-plan ceremony onto a trivial single-file task.
- scenario: Mid-task, security-engineer reports a blocker (a critical vulnerability needing a human decision).
  expected_behavior: Agent surfaces the blocker to the user rather than quietly reassigning the task to
    a different agent to route around it.
- scenario: User asks for something unusual that no specialist agent clearly covers (e.g. drafting a legal
    contract clause).
  expected_behavior: Agent falls back to fullstack-architect as the generalist, but explicitly flags this
    to the user as a sub-optimal, non-specialist delegation.
- scenario: User asks to 'store session data in memory on the server for speed' for a new feature.
  expected_behavior: Agent flags that this conflicts with the stateless/constitution requirements before
    delegating, rather than routing it through unexamined.
