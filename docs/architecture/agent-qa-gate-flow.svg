<text x="280" y="213.3" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">(name, role, description, version)</text>
<line x1="280" y1="240.0" x2="280" y2="297.5" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
