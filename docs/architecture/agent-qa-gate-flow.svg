<text x="280" y="648.3" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">with version field?</text>
<line x1="280" y1="672.5" x2="280" y2="735.0" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<polygon points="280,735.0 450.0,780 280,825.0 110.0,780" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="280" y="766.3" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">eval_results.json: PASS</text>
<text x="280" y="784.3" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">recorded for every</text>
<text x="280" y="802.3" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">scenario/prompt id?</text>
<line x1="280" y1="825.0" x2="280" y2="853.0" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="120" y="880.0" width="320" height="60" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
