<line x1="450.0" y1="200" x2="510" y2="470" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrowr)" stroke-dasharray="7,5"/>
<line x1="460.0" y1="345" x2="510" y2="470" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrowr)" stroke-dasharray="7,5"/>
<line x1="450.0" y1="490" x2="510" y2="470" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrowr)" stroke-dasharray="7,5"/>
<line x1="440.0" y1="635" x2="510" y2="470" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrowr)" stroke-dasharray="7,5"/>
<line x1="450.0" y1="780" x2="510" y2="470" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrowr)" stroke-dasharray="7,5"/>
<rect x="510" y="430" width="260" height="80" rx="8" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2"/>
<text x="640.0" y="455.7" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">❌ BLOCKED</text>
<text x="640.0" y="474.7" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">fix and re-run</text>
<text x="640.0" y="493.7" font-size="14" font-weight="600" fill="#1e1e1e" text-anchor="middle">agent_gate.py</text>
<line x1="240.0" y1="1010.0" x2="300.0" y2="1010.0" stroke="#c92a2a" stroke-width="2.2" stroke-dasharray="7,5"/>
<text x="310.0" y="1014.0" font-size="12" fill="#495057">= any check fails</text>
<text x="410.0" y="1045.0" font-size="11" fill="#495057" text-anchor="middle">python3 .claude/agents/_framework/agent_gate.py check</text>
<text x="410.0" y="1062.0" font-size="11" fill="#495057" text-anchor="middle">--agents-dir .claude/agents --agent-name &lt;name&gt;</text>
</svg>