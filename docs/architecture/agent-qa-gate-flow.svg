<rect x="0" y="0" width="820" height="1080" fill="#f8f9fa"/>
<text x="410.0" y="42" font-size="24" font-weight="700" fill="#1e1e1e" text-anchor="middle">Agent QA Gate — Architecture</text>

<rect x="140" y="90" width="280" height="55" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
