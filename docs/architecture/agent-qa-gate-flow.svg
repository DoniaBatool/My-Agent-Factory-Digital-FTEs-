<text x="280" y="349.3" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">(Role, Scope, Tools, Guardrails,</text>
<text x="280" y="367.3" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">Escalation, Out of Scope)</text>
<line x1="280" y1="392.5" x2="280" y2="450.0" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<polygon points="280,450.0 450.0,490 280,530.0 110.0,490" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
