<text x="280" y="503.3" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">≥5 redteam_prompts.yaml?</text>
<line x1="280" y1="530.0" x2="280" y2="597.5" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#arrow)"/>
<polygon points="280,597.5 440.0,635 280,672.5 120.0,635" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
